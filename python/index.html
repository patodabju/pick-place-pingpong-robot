<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO Q Camera Stream Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #bbb;
      margin-bottom: 20px;
    }

    .frame-container {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 540px;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <h1>UNO Q Camera Stream Test</h1>
  <p>If the camera stream is available, it should appear below.</p>

  <div class="frame-container">
    <iframe id="videoFrame" src="/embed"></iframe>
  </div>
</body>
</html>
