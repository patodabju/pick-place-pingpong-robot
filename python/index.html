<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNO Q Camera Stream Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 24px;
    }
    .frame-container {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 540px;
      border: none;
      background: #000;
    }
    ul {
      text-align: left;
      max-width: 900px;
      margin: 20px auto 0;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>UNO Q Camera Stream Test</h1>
  <p>Temporary test page for browser-based camera streaming.</p>

  <div class="frame-container">
    <iframe src="/embed"></iframe>
  </div>

  <ul id="detections"></ul>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(`http://${window.location.host}`);
    const detectionsList = document.getElementById("detections");

    socket.on("detection", (message) => {
      const li = document.createElement("li");
      li.textContent = `${message.content} - ${(message.confidence * 100).toFixed(1)}% - ${message.timestamp}`;
      detectionsList.prepend(li);

      while (detectionsList.children.length > 5) {
        detectionsList.removeChild(detectionsList.lastChild);
      }
    });
  </script>
</body>
</html>
